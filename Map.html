<!-- MAPNEST CUSTOM DIALOG SYSTEM -->
<div id="mapnest-modal-root" aria-hidden="true">
    <div id="mapnest-modal-backdrop"></div>

    <div id="mapnest-modal" role="dialog" aria-modal="true">

        <div id="mapnest-modal-icon">✦</div>

        <div id="mapnest-modal-title"></div>
        <div id="mapnest-modal-message"></div>

        <input
            id="mapnest-modal-input"
            type="text"
            autocomplete="off"
        >

        <div id="mapnest-modal-actions">
            <button id="mapnest-modal-cancel">
                Cancel
            </button>

            <button id="mapnest-modal-confirm">
                Confirm
            </button>
        </div>

    </div>
</div>

<script>
(function () {

    const root =
        document.getElementById("mapnest-modal-root");

    const title =
        document.getElementById("mapnest-modal-title");

    const message =
        document.getElementById("mapnest-modal-message");

    const input =
        document.getElementById("mapnest-modal-input");

    const cancel =
        document.getElementById("mapnest-modal-cancel");

    const confirm =
        document.getElementById("mapnest-modal-confirm");

    let resolver = null;

    function close(value) {

        root.classList.remove("open");
        root.setAttribute("aria-hidden", "true");

        const r = resolver;
        resolver = null;

        if (r) r(value);
    }

    function open(type, heading, text, confirmText, value) {

        title.textContent = heading;
        message.textContent = text || "";

        confirm.textContent =
            confirmText || "Confirm";

        input.value = value || "";

        input.style.display =
            type === "prompt" ? "block" : "none";

        cancel.style.display = "block";

        root.classList.add("open");
        root.setAttribute("aria-hidden", "false");

        setTimeout(function () {

            if (type === "prompt")
                input.focus();
            else
                confirm.focus();

        }, 160);
    }

    window.MapNestModal = {

        confirm: function (
            heading,
            text,
            confirmText
        ) {

            return new Promise(function (resolve) {

                resolver = resolve;

                open(
                    "confirm",
                    heading,
                    text,
                    confirmText
                );

            });

        },

        prompt: function (
            heading,
            text,
            defaultValue
        ) {

            return new Promise(function (resolve) {

                resolver = function (value) {
                    resolve(value);
                };

                open(
                    "prompt",
                    heading,
                    text,
                    "Create",
                    defaultValue || ""
                );

            });

        },

        alert: function (
            heading,
            text
        ) {

            return new Promise(function (resolve) {

                resolver = resolve;

                cancel.style.display = "none";

                open(
                    "alert",
                    heading,
                    text,
                    "OK"
                );

            });

        }

    };

    confirm.addEventListener(
        "click",
        function () {

            if (input.style.display !== "none") {
                const value =
                    input.value.trim();

                close(value || null);
            } else {
                close(true);
            }

        }
    );

    cancel.addEventListener(
        "click",
        function () {
            close(false);
        }
    );

    document.getElementById(
        "mapnest-modal-backdrop"
    ).addEventListener(
        "click",
        function () {
            close(false);
        }
    );

    document.addEventListener(
        "keydown",
        function (event) {

            if (!root.classList.contains("open"))
                return;

            if (event.key === "Escape") {
                event.preventDefault();
                close(false);
            }

            if (
                event.key === "Enter" &&
                input.style.display !== "none" &&
                document.activeElement === input
            ) {
                event.preventDefault();
                confirm.click();
            }

        }
    );

})();
</script>

<script>
(function () {

    function byId(id) {
        return document.getElementById(id);
    }

    function activate(id) {
        document.querySelectorAll(".mn-level-btn")
            .forEach(function (b) {
                b.classList.remove("active");
            });

        const el = byId(id);
        if (el) el.classList.add("active");
    }

    const home = byId("mn-home");
    const search = byId("mn-search");
    const country = byId("mn-country");
    const state = byId("mn-state");
    const district = byId("mn-district");
    const reset = byId("mn-reset");
    const fullscreen = byId("mn-fullscreen");

    if (home) {
        home.onclick = function () {
            if (window.MapApp && MapApp.map)
                MapApp.map.setView([20, 0], 2);
        };
    }

    if (search) {
        search.onclick = function () {
            const input = byId("search");
            if (input) {
                input.focus();
                input.select();
            }
        };
    }

    if (country) {
        country.onclick = async function () {
            if (window.MapApp) {
                activate("mn-country");
                await MapApp.showCountry();
            }
        };
    }

    if (state) {
        state.onclick = async function () {
            if (window.MapApp) {
                activate("mn-state");
                await MapApp.showStates();
            }
        };
    }

    if (district) {
        district.onclick = async function () {
            if (window.MapApp) {
                activate("mn-district");
                await MapApp.showDistricts();
            }
        };
    }

    if (fullscreen) {
        fullscreen.onclick = function () {

            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }

        };
    }

    if (reset) {
        reset.onclick = function () {

            if (
                window.MapControls &&
                typeof MapControls.resetColors === "function"
            ) {
                if (confirm("Reset all markings in this project?"))
                    MapControls.resetColors();
            }

        };
    }

    /* Live map telemetry */

    function updateHUD() {

        if (!window.MapApp || !MapApp.map)
            return;

        const map = MapApp.map;
        const center = map.getCenter();

        const zoom = byId("mn-zoom-readout");
        const position = byId("mn-position-readout");

        if (zoom)
            zoom.textContent =
                "ZOOM " + map.getZoom().toFixed(1);

        if (position) {

            const lat =
                Math.abs(center.lat).toFixed(1) +
                "° " +
                (center.lat >= 0 ? "N" : "S");

            const lng =
                Math.abs(center.lng).toFixed(1) +
                "° " +
                (center.lng >= 0 ? "E" : "W");

            position.textContent =
                lat + " · " + lng;
        }
    }

    setInterval(updateHUD, 250);

    document.addEventListener(
        "fullscreenchange",
        function () {
            const btn = byId("mn-fullscreen");

            if (btn)
                btn.classList.toggle(
                    "active",
                    !!document.fullscreenElement
                );
        }
    );

})();
</script>

<script>
(function () {

    function bind(id, fn) {
        const el = document.getElementById(id);
        if (el) el.onclick = fn;
    }

    bind("mn-home", function () {
        if (window.MapApp && MapApp.map)
            MapApp.map.setView([20, 0], 2);
    });

    bind("mn-country", function () {
        if (window.MapApp)
            MapApp.showCountry();
    });

    bind("mn-state", function () {
        if (window.MapApp)
            MapApp.showStates();
    });

    bind("mn-district", function () {
        if (window.MapApp)
            MapApp.showDistricts();
    });

    bind("mn-project", function () {
        const selector =
            document.getElementById("mapnest-project-select");

        if (selector) {
            selector.focus();
            selector.click();
        }
    });

    bind("mn-reset", function () {
        if (window.MapControls &&
            typeof MapControls.resetColors === "function") {

            MapNestModal.confirm(
                "Reset markings?",
                "This will remove the saved markings from this workspace.",
                "Reset"
            ).then(function(ok) {

                if (ok)
                    MapControls.resetColors();

            });
        }
    });

})();
</script>

<script>
(function () {

    function organizeMapNestUI() {

        const center =
            document.querySelector(".mapnest-command-center");

        const project =
            document.getElementById("mapnest-project-selector");

        const slot =
            document.getElementById("mn-project-slot");

        if (center && project && slot && !slot.contains(project)) {
            slot.appendChild(project);
            project.style.position = "static";
            project.style.top = "auto";
            project.style.right = "auto";
            project.style.left = "auto";
            project.style.bottom = "auto";
            project.style.margin = "0";
        }
    }

    setTimeout(organizeMapNestUI, 700);
    setTimeout(organizeMapNestUI, 1500);

})();
</script>

<script>
(function () {

    const welcome =
        document.getElementById("mapnest-welcome");

    if (!welcome) return;

    /*
     * MapNest welcome is shown ONLY ONCE:
     * the first time this browser opens the homepage.
     *
     * Reloading homepage:
     *     no welcome
     *
     * Opening another page:
     *     no welcome
     *
     * Returning to homepage:
     *     no welcome
     *
     * Changing workspace:
     *     no welcome
     */

    const WELCOME_KEY =
        "mapnest_home_welcome_seen_v1";

    if (localStorage.getItem(WELCOME_KEY) === "1") {
        welcome.remove();
        return;
    }

    let shown = false;
    let dismissed = false;

    function showWelcome() {

        if (shown || dismissed) return;

        shown = true;

        /* Mark it immediately so even a reload during
           the animation will never show it again. */
        localStorage.setItem(
            WELCOME_KEY,
            "1"
        );

        requestAnimationFrame(function () {
            requestAnimationFrame(function () {

                if (!dismissed)
                    welcome.classList.add("is-ready");

            });
        });
    }

    function mapIsReady() {

        if (!window.MapApp || !MapApp.map)
            return false;

        if (!MapApp.countryLayer)
            return false;

        if (
            typeof MapApp.countryLayer.getLayers !==
            "function"
        )
            return false;

        return (
            MapApp.countryLayer.getLayers().length > 0
        );
    }

    function waitForMap() {

        if (dismissed) return;

        if (mapIsReady()) {
            showWelcome();
            return;
        }

        setTimeout(waitForMap, 100);
    }

    function dismissWelcome() {

        if (dismissed) return;

        dismissed = true;

        welcome.classList.add("dismissed");

        setTimeout(function () {

            if (welcome.parentNode)
                welcome.remove();

        }, 10);
    }

    waitForMap();

    /* Click anywhere on the welcome screen. */
    welcome.addEventListener(
        "click",
        dismissWelcome
    );

})();
</script>

<script>
(function () {

    const welcome =
        document.getElementById("mapnest-welcome");

    if (!welcome) return;

    function dismissWelcome() {
        welcome.style.opacity = "0";
        welcome.style.pointerEvents = "none";
        welcome.style.transition = "opacity .25s ease";

        setTimeout(function () {
            if (welcome.parentNode)
                welcome.remove();
        }, 260);
    }

    /* Anything on the welcome screen dismisses it. */
    welcome.addEventListener("click", dismissWelcome);

})();
</script>
