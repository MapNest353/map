<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
    box-sizing: border-box;
}

html, body, #map {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#map {
    background: #ffffff;
}

/* SEARCH */

#searchContainer {
    position: absolute;
    z-index: 1000;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    max-width: calc(100% - 30px);
}

#search {
    width: 100%;
    padding: 11px 14px;
    border: none;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

#results {
    margin-top: 5px;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
    display: none;
}

.result {
    padding: 10px 14px;
    cursor: pointer;
}

.result:hover {
    background: #eee;
}

/* LEVEL BUTTON */

#levelButton {
    position: absolute;
    z-index: 1000;
    top: 15px;
    right: 15px;
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    background: white;
    cursor: pointer;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

#levelButton:hover {
    background: #eee;
}

/* INFO */

#info {
    position: absolute;
    z-index: 1000;
    bottom: 20px;
    left: 20px;
    padding: 12px 15px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
    font-size: 13px;
}

#infoName {
    font-weight: bold;
    margin-bottom: 4px;
}
#map-version {
    position: absolute;
    bottom: 10px;
    left: 10px;
    z-index: 1000;
    background: rgba(255,255,255,.92);
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 11px;
    color: #555;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
}
</style>
    <link rel="stylesheet" href="css/style.css?v=2026081901">
<link rel="stylesheet" href="css/glossy.css?v=local"></head>

<body>

<!-- MAPNEST PREMIUM COMMAND CENTER -->
<div class="mapnest-command-center">

    <button id="mn-home" title="Reset view">
        ⌂
        <span class="tooltip">Reset View</span>
    </button>

    <button id="mn-search" title="Search">
        ⌕
        <span class="tooltip">Search</span>
    </button>

    <span class="divider"></span>


    <button id="mn-project" title="Projects">
        ◎
        <span class="tooltip">Projects</span>
    </button>

    <button id="mn-reset" title="Reset markings">
        ↺
        <span class="tooltip">Reset Markings</span>
    </button>

</div>

<!-- MAPNEST WELCOME -->
<div id="mapnest-welcome">
    <div class="mapnest-welcome-card">

        <div class="mapnest-welcome-mark">✦</div>

        <div class="mapnest-welcome-title">
            Welcome to MapNest
        </div>

        <div class="mapnest-welcome-subtitle">
            Your personal world map.
        </div>

        <div class="mapnest-welcome-grid">

            <div>
                <span>🌍</span>
                <strong>Explore</strong>
                <small>Navigate countries, states and districts.</small>
            </div>

            <div>
                <span>✦</span>
                <strong>Mark</strong>
                <small>Click a region to add it to your map.</small>
            </div>

            <div>
                <span>◌</span>
                <strong>Projects</strong>
                <small>Keep different maps completely separate.</small>
            </div>

        </div>

        <button id="mapnest-welcome-start">
            Start exploring
        </button>

    </div>
</div>

<div id="map"></div>

<div id="map-version"></div>

<div id="searchContainer">

    <input
        id="search"
        type="text"
        placeholder="Search..."
        autocomplete="off"
    >

    <div id="results"></div>

</div>

<button id="levelButton">
    Countries
</button>

<div id="info">

    <div id="infoName">
        World
    </div>

    <div>
        Click = color &nbsp; | &nbsp;
        Shift + click = remove
    </div>

</div>


<!-- Leaflet -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<!-- Our code -->

<script>
(function () {

    function click(id) {
        const el = document.getElementById(id);
        if (el) el.click();
    }

    document.getElementById("mn-search").onclick = function () {
        const search = document.getElementById("search");
        if (search) {
            search.focus();
            search.select();
        }
    };

    document.getElementById("mn-home").onclick = function () {
        if (window.MapApp && MapApp.map)
            MapApp.map.setView([20, 0], 2);
    };

    document.getElementById("mn-reset").onclick = function () {
        if (window.MapControls &&
            typeof MapControls.resetColors === "function") {
            if (confirm("Reset all saved markings?"))
                MapControls.resetColors();
        }
    };

})();
</script>
<script src="js/data-loader.js?v=local" + Date.now() + ""></script>

<script src="js/layers.js?v=1787204164"></script>

<script src="js/controls.js?v=local" + Date.now() + ""></script>

<script src="js/map.js?v=1787204164" + Date.now() + ""></script>


<!-- save-export.js disabled: functionality is built into controls.js -->
<script src="js/version.js?v=999999"></script>


<script src="js/version-display.js"></script>\n<script>
(function () {
    const welcome = document.getElementById("mapnest-welcome");
    const start = document.getElementById("mapnest-welcome-start");

    if (!welcome || !start) return;

    start.onclick = function () {
        welcome.style.opacity = "0";
        welcome.style.transition = "opacity .25s ease";

        setTimeout(function () {
            welcome.remove();
        }, 260);
    };
})();
</script>
</body>
</html>

<style>
.map-level-controls button.active {
    background: #e9e9e9 !important;
}
.map-level-controls button:not(.active):hover {
    background: #f7f7f7 !important;
}
.map-level-controls button.active:hover {
    background: #e9e9e9 !important;
}
</style>
